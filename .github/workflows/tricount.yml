name: Tricount

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: tricount

jobs:
  synchro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les outils
        run: pip install --quiet tricount-extractor openpyxl cryptography
      - name: Extraire les tricounts
        env:
          TRICOUNT_IDS: ${{ secrets.TRICOUNT_IDS }}
        run: |
          mkdir -p extraction
          tricount-extractor -id $TRICOUNT_IDS -f extraction > /dev/null
      - name: Préparer les données chiffrées
        env:
          TRICOUNT_MOI: ${{ secrets.TRICOUNT_MOI }}
          TRICOUNT_PHRASE: ${{ secrets.TRICOUNT_PHRASE }}
        run: python outils/tricount_vers_carnet.py extraction tricount.json.enc
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tricount.json.enc
          git diff --cached --quiet || (git commit -m "Tricount : mise à jour" && git push)
