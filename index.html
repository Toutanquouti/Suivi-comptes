<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de comptes</title>
<meta name="description" content="Suivi de budget saisi à la main : reste à dépenser, objectif d’épargne, analyse et bilan mensuel.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#5B3FFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F1E" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Gabarito:wght@500..900&display=swap" crossorigin>
<style>
/* Mise en page : une colonne de cartes « bento » sur téléphone (onglets en bas, gros bouton + flottant) ; dès 960px, deux colonnes et onglets dans l'en-tête. */
:root {
  --fond: #F4F5FB;
  --carte: #FFFFFF;
  --carte-2: #F1F2F9;
  --encre: #15162B;
  --encre-2: #4A4D6A;
  --encre-3: #6E7191;
  --filet: #E7E8F2;
  --filet-2: #D3D5E5;
  --action: #5B3FFF;
  --action-texte: #4B30E8;
  --action-voile: #ECE8FF;
  --sur-action: #FFFFFF;
  --menthe: #D5F6E9;
  --lavande: #ECE8FF;
  --peche: #FFE6DC;
  --ciel: #DCEEFF;
  --soleil: #FFF2C4;
  --bon: #087A52;
  --mauvais: #D63B2F;
  --attention: #A35F00;
  --serie-dep: #FF6B57;
  --serie-rev: #14B88A;
  --serie-epa: #6A4DFF;
  --serie-ref: #A9ADC6;
  --attenue: #DCDEEC;
  --chaud-1: #FFE6E0; --chaud-2: #FFC4B8; --chaud-3: #FF9B88; --chaud-4: #FF6B57;
  --mix-ico: #15162B; --teinte: 15%; --force: 72%;
  --voile-fond: rgba(21, 22, 43, .45);
  --ombre: 0 1px 2px rgba(21, 22, 43, .04), 0 8px 24px rgba(21, 22, 43, .07);
  --ombre-fab: 0 10px 24px rgba(91, 63, 255, .38), 0 2px 6px rgba(21, 22, 43, .14);
  --bord-carte: transparent;
  --f-titre: "Gabarito", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-texte: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --rayon: 22px;
  --h-onglets: 68px;
  --barre-statut: #5B3FFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #0E0F1E; --carte: #1B1C36; --carte-2: #23254A;
    --encre: #EEF0FA; --encre-2: #BDC0DA; --encre-3: #9295B5;
    --filet: #2B2D50; --filet-2: #3B3E66;
    --action: #6A4DFF; --action-texte: #A99BFF; --action-voile: #2A2558; --sur-action: #FFFFFF;
    --menthe: #11382D; --lavande: #272150; --peche: #3E251F; --ciel: #142C47; --soleil: #3A3217;
    --bon: #3DD598; --mauvais: #FF8A7A; --attention: #FFC14D;
    --serie-dep: #F2583F; --serie-rev: #13A87D; --serie-epa: #7B62FF; --serie-ref: #6F739A;
    --attenue: #34375E;
    --chaud-1: #3B2424; --chaud-2: #612F28; --chaud-3: #9A3D2E; --chaud-4: #F2583F;
    --mix-ico: #FFFFFF; --teinte: 26%; --force: 82%;
    --voile-fond: rgba(0, 0, 0, .6);
    --ombre: 0 1px 2px rgba(0, 0, 0, .4);
    --ombre-fab: 0 10px 24px rgba(0, 0, 0, .5);
    --bord-carte: #2B2D50; --barre-statut: #0E0F1E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #0E0F1E; --carte: #1B1C36; --carte-2: #23254A;
  --encre: #EEF0FA; --encre-2: #BDC0DA; --encre-3: #9295B5;
  --filet: #2B2D50; --filet-2: #3B3E66;
  --action: #6A4DFF; --action-texte: #A99BFF; --action-voile: #2A2558; --sur-action: #FFFFFF;
  --menthe: #11382D; --lavande: #272150; --peche: #3E251F; --ciel: #142C47; --soleil: #3A3217;
  --bon: #3DD598; --mauvais: #FF8A7A; --attention: #FFC14D;
  --serie-dep: #F2583F; --serie-rev: #13A87D; --serie-epa: #7B62FF; --serie-ref: #6F739A;
  --attenue: #34375E;
  --chaud-1: #3B2424; --chaud-2: #612F28; --chaud-3: #9A3D2E; --chaud-4: #F2583F;
  --mix-ico: #FFFFFF; --teinte: 26%; --force: 82%;
  --voile-fond: rgba(0, 0, 0, .6);
  --ombre: 0 1px 2px rgba(0, 0, 0, .4);
  --ombre-fab: 0 10px 24px rgba(0, 0, 0, .5);
  --bord-carte: #2B2D50; --barre-statut: #0E0F1E;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--fond); color: var(--encre);
  font-family: var(--f-texte); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) calc(176px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
body.fige { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
.app { max-width: 1120px; margin: 0 auto; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.fl { width: 9px; height: 9px; fill: currentColor; flex: none; }
:focus-visible { outline: 3px solid var(--action-texte); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* En-tête */
.entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 6px; }
.marque { display: flex; align-items: center; gap: 10px; color: var(--encre); text-decoration: none; min-width: 0; }
.logo { width: 34px; height: 34px; flex: none; }
.marque-nom { font-family: var(--f-titre); font-weight: 800; font-size: 21px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
.marque-nom em { font-style: normal; font-weight: 500; color: var(--encre-3); }
.entete-droite { display: flex; align-items: center; gap: 10px; }
.btn-budget { display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--action-voile); color: var(--action-texte); font-weight: 800; font-size: 14px; padding: 9px 14px 9px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.btn-budget .ico { width: 18px; height: 18px; }

/* Onglets */
.onglets { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--carte); box-shadow: 0 -1px 0 var(--filet), 0 -6px 20px rgba(21, 22, 43, .05); padding: 7px max(16px, env(safe-area-inset-right, 0px)) calc(7px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.onglet { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px; border: 0; background: none; color: var(--encre-3); font-size: 12px; font-weight: 800; cursor: pointer; border-radius: 14px; }
.onglet-ico { display: grid; place-items: center; width: 60px; height: 32px; border-radius: 16px; transition: background-color .2s ease, color .2s ease; }
.onglet .ico { width: 22px; height: 22px; }
.onglet[aria-current="page"] { color: var(--action-texte); }
.onglet[aria-current="page"] .onglet-ico { background: var(--action); color: var(--sur-action); }

/* Bouton + */
.fab { position: fixed; z-index: 31; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--h-onglets) + 16px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; border-radius: 22px; border: 0; background: var(--action); color: var(--sur-action); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--ombre-fab); cursor: pointer; transition: transform .15s ease; }
.fab-ico { display: contents; }
.fab .ico { width: 30px; height: 30px; stroke-width: 2.4; }
.fab-txt { display: none; }
.fab:active { transform: scale(.94); }

/* Structure */
.vue { display: grid; gap: 14px; }
.tete-vue { display: grid; gap: 2px; padding-block: 8px 0; }
.surtitre { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--action-texte); }
.tete-ligne { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tete-vue h1 { font-family: var(--f-titre); font-weight: 800; font-size: clamp(28px, 8vw, 38px); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; min-width: 0; }
.tete-vue h1 .an { color: var(--encre-3); font-weight: 600; }
.tete-detail { color: var(--encre-2); font-size: 14px; }
.fleches { display: flex; gap: 8px; flex: none; }
.btn-rond { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--carte); color: var(--action-texte); box-shadow: var(--ombre); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
.btn-rond:disabled { opacity: .3; cursor: default; box-shadow: none; }
.btn-rond .ico { width: 22px; height: 22px; stroke-width: 2.3; }
.carte { background: var(--carte); border: 1px solid var(--bord-carte); border-radius: var(--rayon); padding: 18px; box-shadow: var(--ombre); min-width: 0; }
.carte.douce { box-shadow: none; }
.carte-tete { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.carte-tete > div { min-width: 0; }
.carte h2 { font-family: var(--f-titre); font-weight: 750; font-size: 20px; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
.sous { color: var(--encre-3); font-size: 13.5px; margin-top: 3px; }
.etiquette { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-3); }
.vide { color: var(--encre-3); font-size: 14px; padding: 6px 0; }
.grille-360, .grille-2 { display: grid; gap: 14px; }
.col { display: grid; gap: 14px; align-content: start; min-width: 0; }
.a-retenir { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--soleil); font-size: 14px; font-weight: 600; color: var(--encre); }
.a-retenir .ico { width: 18px; height: 18px; margin-top: 1px; color: var(--attention); }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15px; line-height: 1.2; border-radius: 14px; padding: 13px 18px; border: 0; cursor: pointer; text-align: center; }
.btn .ico { width: 19px; height: 19px; stroke-width: 2.1; }
.btn-principal { background: var(--action); color: var(--sur-action); box-shadow: 0 6px 16px rgba(91, 63, 255, .28); }
.btn-doux { background: var(--action-voile); color: var(--action-texte); }
.btn-danger { background: var(--peche); color: var(--mauvais); }
.btn-petit { padding: 9px 13px; font-size: 14px; border-radius: 12px; }
.lien { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--action-texte); font-weight: 800; font-size: 14px; padding: 4px 2px; cursor: pointer; white-space: nowrap; }
.lien .ico { width: 16px; height: 16px; stroke-width: 2.4; }
.bascule { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--carte-2); color: var(--encre-2); font-size: 13px; font-weight: 800; padding: 7px 11px; border-radius: 11px; cursor: pointer; flex: none; }
.bascule .ico { width: 16px; height: 16px; }
.segment { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--carte); border-radius: 14px; padding: 4px; gap: 2px; box-shadow: var(--ombre); }
.segment button { flex: 1 1 auto; border: 0; background: none; font-weight: 800; font-size: 13.5px; color: var(--encre-2); padding: 8px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.segment button[aria-pressed="true"] { background: var(--action); color: var(--sur-action); }
.segment-plein { display: flex; width: 100%; flex-wrap: nowrap; }
.segment-plein button { flex: 1 1 0; min-width: 0; padding-inline: 4px; }
@media (max-width: 440px) { .marque-nom em { display: none; } }
.segment.discret { box-shadow: none; background: var(--carte-2); }
.segment.discret button[aria-pressed="true"] { background: var(--carte); color: var(--action-texte); box-shadow: var(--ombre); }

/* Écarts et pastilles */
.delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta.bon { color: var(--bon); }
.delta.mauvais { color: var(--mauvais); }
.delta.neutre { color: var(--encre-3); font-weight: 700; }
.ref { color: var(--encre-3); font-size: 13px; font-weight: 600; }
.pastille { display: inline-block; width: 10px; height: 10px; border-radius: 4px; flex: none; background: var(--c); }
.ico-cat { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--cc) var(--teinte), var(--carte)); color: color-mix(in srgb, var(--cc) var(--force), var(--mix-ico)); }
.ico-cat .ico { width: 21px; height: 21px; stroke-width: 2; }
.ico-cat.mini { width: 28px; height: 28px; border-radius: 10px; }
.ico-cat.mini .ico { width: 16px; height: 16px; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--encre-2); font-weight: 600; margin-bottom: 10px; }
.leg { display: inline-flex; align-items: center; gap: 7px; }
.leg-cle { display: inline-block; background: var(--c); flex: none; }
.leg-cle.ligne { width: 16px; height: 3px; border-radius: 2px; }
.leg-cle.tirets { width: 16px; height: 3px; background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 8px); }
.leg-cle.barre { width: 12px; height: 12px; border-radius: 4px; }
.leg-cle.repere { width: 3px; height: 14px; border-radius: 2px; }
.leg-cle.hachure { width: 14px; height: 12px; border-radius: 4px; background: repeating-linear-gradient(135deg, var(--c) 0 3px, transparent 3px 6px); }
.leg-cle.triangle { width: 0; height: 0; background: none; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--c); }
</style>
<style>
/* Carte principale du mois */
.hero { border-radius: 26px; padding: 18px; display: grid; gap: 14px; background: var(--lavande); }
.hero.ok { background: var(--menthe); }
.hero.juste { background: var(--soleil); }
.hero.depasse { background: var(--peche); }
.hero-haut { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.puce-statut { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 9px; border-radius: 999px; font-weight: 800; font-size: 13.5px; background: var(--carte); color: var(--encre); box-shadow: var(--ombre); }
.puce-statut .ico { width: 17px; height: 17px; stroke-width: 2.3; }
.ok .puce-statut .ico { color: var(--bon); }
.juste .puce-statut .ico { color: var(--attention); }
.depasse .puce-statut .ico { color: var(--mauvais); }
.hero-jours { font-size: 13.5px; font-weight: 700; color: var(--encre-2); }
.hero-libelle { font-weight: 700; color: var(--encre-2); font-size: 15px; }
.hero-montant { font-family: var(--f-titre); font-weight: 800; font-size: clamp(46px, 14vw, 66px); line-height: .98; letter-spacing: -0.025em; margin-top: 2px; }
.hero-sous { font-size: 15px; color: var(--encre-2); margin-top: 6px; }
.hero-sous strong { color: var(--encre); }
.jauge { display: grid; gap: 8px; }
.jauge-piste { position: relative; height: 20px; border-radius: 10px; background: color-mix(in srgb, var(--carte) 80%, transparent); }
.jauge-proj, .jauge-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 10px; }
.jauge-proj { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--serie-dep) 55%, transparent) 0 5px, transparent 5px 10px); }
.jauge-fill { background: var(--serie-dep); }
.jauge-budget { position: absolute; top: -6px; bottom: -6px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--encre); }
.jauge-rythme { position: absolute; top: -12px; width: 0; height: 0; margin-left: -7px; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid var(--action); }
.jauge-echelle { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; color: var(--encre-2); }
.jauge-echelle strong { color: var(--encre); }
.jauge-legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; font-weight: 600; color: var(--encre-2); }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hero-stat { background: color-mix(in srgb, var(--carte) 78%, transparent); border-radius: 16px; padding: 10px 11px; display: grid; gap: 1px; min-width: 0; }
.hero-stat .etiquette { font-size: 11px; letter-spacing: .04em; display: flex; align-items: center; gap: 5px; color: var(--encre-2); }
.hero-stat strong { font-family: var(--f-titre); font-size: 18px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.hero-stat small { font-size: 12px; color: var(--encre-2); font-weight: 600; }
.hero-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: 16px; background: color-mix(in srgb, var(--carte) 78%, transparent); font-size: 14px; font-weight: 600; }
.hero-cta p { flex: 1 1 200px; }

/* Catégories et enveloppes */
.repartition { display: flex; gap: 3px; height: 16px; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.repartition span { background: var(--cc); min-width: 4px; }
.repartition-legende { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; font-weight: 700; color: var(--encre-2); margin-bottom: 8px; }
.repartition-legende span { display: inline-flex; align-items: center; gap: 6px; }
.repartition-legende i { width: 9px; height: 9px; border-radius: 3px; background: var(--cc); display: inline-block; }
.envs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.env { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 16px; grid-template-areas: "ico nom montant chev" "ico barre info chev"; column-gap: 12px; row-gap: 6px; align-items: center; width: calc(100% + 16px); margin: 0 -8px; padding: 9px 8px; border: 0; border-radius: 16px; background: none; text-align: left; cursor: pointer; }
.env:hover { background: var(--carte-2); }
.env[aria-pressed="true"] { background: var(--action-voile); }
.env .ico-cat { grid-area: ico; }
.env-nom { grid-area: nom; font-weight: 750; min-width: 0; overflow-wrap: anywhere; }
.env-montant { grid-area: montant; font-weight: 800; text-align: right; white-space: nowrap; }
.env-montant small { font-weight: 600; color: var(--encre-3); font-size: 12.5px; }
.env-barre { grid-area: barre; position: relative; height: 9px; border-radius: 5px; background: var(--carte-2); }
.env-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--cc); min-width: 4px; }
.env-fill.trop { background: repeating-linear-gradient(135deg, var(--serie-dep) 0 5px, color-mix(in srgb, var(--serie-dep) 70%, var(--carte)) 5px 9px); }
.env-repere { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--encre); }
.env-info { grid-area: info; text-align: right; font-size: 12.5px; font-weight: 700; color: var(--encre-3); white-space: nowrap; }
.env-info.mauvais { color: var(--mauvais); }
.env-info.attention { color: var(--attention); }
.env-info.bon { color: var(--bon); }
.env .chev { grid-area: chev; color: var(--encre-3); width: 16px; height: 16px; stroke-width: 2.4; }

/* Opérations */
.ops-outils { display: grid; gap: 10px; margin-bottom: 4px; }
.recherche { position: relative; }
.recherche .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--encre-3); width: 18px; height: 18px; pointer-events: none; }
.recherche input { width: 100%; font-size: 16px; padding: 11px 12px 11px 40px; border: 0; border-radius: 14px; background: var(--carte-2); color: var(--encre); }
.filtre-actif { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; padding: 6px 8px 6px 12px; border-radius: 999px; background: var(--action); color: var(--sur-action); border: 0; cursor: pointer; justify-self: start; }
.filtre-actif .ico { width: 15px; height: 15px; stroke-width: 2.4; }
.jour { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 0 4px; font-size: 13px; font-weight: 800; color: var(--encre-2); }
.total-jour { font-weight: 700; color: var(--encre-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.op { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: calc(100% + 16px); margin: 0 -8px; padding: 8px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 14px; }
.op:hover { background: var(--carte-2); }
.op-texte { display: grid; min-width: 0; }
.op-titre { font-weight: 700; overflow-wrap: anywhere; }
.op-sous { font-size: 13px; color: var(--encre-3); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-weight: 600; }
.op-montant { font-weight: 800; font-size: 15.5px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.op-montant.credit { color: var(--bon); }
.op.nouveau { animation: eclat 1.8s ease-out; }
@keyframes eclat { from { background: var(--action-voile); } to { background: transparent; } }
.pill-ex { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--action-texte); background: var(--action-voile); border-radius: 999px; padding: 0 7px; line-height: 17px; }
.plus-ops { margin-top: 12px; width: 100%; }

/* Tuiles, indicateurs, tableaux */
.tuiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tuile { background: var(--carte); border: 1px solid var(--bord-carte); border-radius: 18px; padding: 13px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; box-shadow: var(--ombre); }
.tuile .etiquette { display: flex; align-items: flex-start; gap: 6px; letter-spacing: .03em; font-size: 11px; min-height: 2.7em; }
.tuile-valeur { font-family: var(--f-titre); font-weight: 800; font-size: clamp(19px, 5.4vw, 26px); line-height: 1.1; overflow-wrap: anywhere; }
.tuile-ref { font-size: 12.5px; color: var(--encre-3); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--carte); border: 1px solid var(--bord-carte); border-radius: 20px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; box-shadow: var(--ombre); }
.kpi-tete { display: flex; align-items: flex-start; gap: 8px; min-height: 2.6em; }
.kpi-tete .ico-cat { width: 30px; height: 30px; border-radius: 10px; }
.kpi-tete .ico-cat .ico { width: 17px; height: 17px; }
.kpi-tete .etiquette { font-size: 11px; letter-spacing: .03em; line-height: 1.25; padding-top: 2px; }
.kpi-valeur { font-family: var(--f-titre); font-weight: 800; font-size: clamp(21px, 6.2vw, 27px); line-height: 1.1; overflow-wrap: anywhere; }
.spark { height: 34px; }
.kpi-cmp { display: grid; gap: 3px; margin: 0; font-size: 12.5px; }
.kpi-cmp div { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi-cmp dt { color: var(--encre-3); font-weight: 800; }
.kpi-cmp dd { margin: 0; }
.resume { font-size: 18px; line-height: 1.45; font-weight: 600; }
.resume p + p { margin-top: 8px; color: var(--encre-2); font-size: 15px; font-weight: 500; }
.surligne { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--serie-epa) 28%, transparent) 55%); color: inherit; font-weight: 800; padding: 0 .08em; border-radius: 3px; }
.surligne.rose { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--serie-dep) 34%, transparent) 55%); }
.cumul { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--lavande); font-size: 14px; color: var(--encre-2); font-weight: 600; }
.cumul strong { font-family: var(--f-titre); font-size: 20px; color: var(--encre); }
.defile { overflow-x: auto; }
.tab { width: 100%; border-collapse: collapse; font-size: 14px; }
.tab th { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-3); text-align: right; padding: 8px 6px; border-bottom: 2px solid var(--filet); white-space: nowrap; }
.tab td { padding: 10px 6px; border-bottom: 1px solid var(--filet); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.tab th:first-child, .tab td:first-child { text-align: left; padding-left: 0; }
.tab td:first-child { font-weight: 750; }
.tab tfoot td { font-weight: 800; border-bottom: 0; }
.cel-cat { display: flex; align-items: center; gap: 8px; }
.cel-cat i { width: 9px; height: 9px; border-radius: 3px; background: var(--cc); flex: none; }
.details summary { cursor: pointer; font-weight: 800; color: var(--action-texte); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; }
.details summary::-webkit-details-marker { display: none; }
.details summary .ico { width: 16px; height: 16px; stroke-width: 2.4; transition: transform .2s; }
.details[open] summary .ico { transform: rotate(90deg); }
.details[open] summary { margin-bottom: 8px; }

/* Ce qui a changé */
.pont { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
.pont-val { display: grid; line-height: 1.1; }
.pont-val strong { font-family: var(--f-titre); font-size: 22px; font-weight: 800; }
.pont-val small { font-size: 12.5px; color: var(--encre-3); font-weight: 700; }
.pont-fleche { color: var(--encre-3); }
.pont .delta { font-size: 14px; padding: 5px 10px; border-radius: 999px; background: var(--carte-2); }
.divs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.div-ligne { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) 62px; align-items: center; gap: 10px; }
.div-nom { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; min-width: 0; hyphens: auto; }
.div-axe { position: relative; height: 16px; }
.div-axe::before { content: ""; position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--filet-2); border-radius: 1px; }
.div-barre { position: absolute; top: 0; bottom: 0; }
.div-barre.plus { left: 50%; background: var(--serie-dep); border-radius: 0 6px 6px 0; }
.div-barre.moins { right: 50%; background: var(--serie-rev); border-radius: 6px 0 0 6px; }
.div-val { text-align: right; font-weight: 800; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.div-val.plus { color: var(--mauvais); }
.div-val.moins { color: var(--bon); }
.div-axes { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) 62px; gap: 10px; font-size: 11px; font-weight: 700; color: var(--encre-3); margin-top: 8px; }
.div-axes span span { display: inline-flex; align-items: center; white-space: nowrap; }
.div-axes .ico { width: 13px; height: 13px; }
.div-axes span:nth-child(2) { display: flex; justify-content: space-between; }

/* Calendrier */
.cal { display: grid; gap: 6px; }
.cal-ligne { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal-ligne.entetes span { text-align: center; font-size: 11.5px; font-weight: 800; color: var(--encre-3); }
.cal-jour { aspect-ratio: 1; max-width: 100%; border-radius: 11px; border: 0; padding: 0; display: grid; place-items: center; font-size: 13px; font-weight: 800; cursor: pointer; background: var(--carte-2); color: var(--encre); position: relative; }
.cal-jour.n0 { background: var(--menthe); color: var(--bon); }
.cal-jour.n1 { background: var(--chaud-1); }
.cal-jour.n2 { background: var(--chaud-2); }
.cal-jour.n3 { background: var(--chaud-3); color: #15162B; }
.cal-jour.n4 { background: var(--chaud-4); color: #15162B; }
.cal-jour.futur { background: transparent; color: var(--encre-3); box-shadow: inset 0 0 0 1px var(--filet-2); cursor: default; }
.cal-jour.auj { box-shadow: 0 0 0 2px var(--carte), 0 0 0 4px var(--action); }
.cal-jour[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--carte), 0 0 0 4px var(--encre); }
.cal-vide { aspect-ratio: 1; }
.cal-semaine { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; align-items: end; height: 64px; margin-top: 6px; }
.cal-sem-col { display: grid; justify-items: center; align-content: end; gap: 3px; height: 100%; }
.cal-sem-barre { width: 60%; max-width: 22px; border-radius: 5px 5px 2px 2px; background: var(--attenue); min-height: 3px; }
.cal-sem-col.max .cal-sem-barre { background: var(--serie-dep); }
.cal-sem-col small { font-size: 11px; font-weight: 800; color: var(--encre-3); white-space: nowrap; }
.cal-sem-col.max small { color: var(--encre); }
.cal-legende { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12px; font-weight: 700; color: var(--encre-2); margin-top: 6px; }
.cal-legende .ech { display: inline-flex; gap: 3px; align-items: center; }
.cal-legende .ech i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.cal-detail { margin-top: 10px; padding: 12px 14px; border-radius: 16px; background: var(--carte-2); }
.cal-detail-tete { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; margin-bottom: 4px; }
.cal-detail .op { width: calc(100% + 16px); }

/* Graphiques */
.graph { position: relative; width: 100%; min-height: 40px; }
.graph svg { display: block; overflow: visible; touch-action: pan-y; }
.graph .grille { stroke: var(--filet); stroke-width: 1; }
.graph .axe { stroke: var(--filet-2); stroke-width: 1.5; }
.graph .tick { fill: var(--encre-3); font: 700 11.5px var(--f-texte); }
.graph .ligne { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.graph .ligne.tirets { stroke-dasharray: 2 6; stroke-width: 3; }
.graph .aire { stroke: none; fill-opacity: .14; }
.graph .point { stroke: var(--carte); stroke-width: 2.5; }
.graph .etq { fill: var(--encre); font: 800 12.5px var(--f-texte); paint-order: stroke fill; stroke: var(--carte); stroke-width: 4px; stroke-linejoin: round; }
.graph .etq-ref { fill: var(--encre-2); font: 700 11.5px var(--f-texte); paint-order: stroke fill; stroke: var(--carte); stroke-width: 4px; stroke-linejoin: round; }
.graph .ref { stroke: var(--encre-2); stroke-width: 1.5; }
.graph .ref.tirets { stroke-dasharray: 6 5; stroke: var(--serie-epa); stroke-width: 2; }
.graph .curseur-ligne { stroke: var(--encre-3); stroke-width: 1; }
.graph .bande { fill: var(--carte-2); }
.graph .survol { cursor: crosshair; outline: none; }
.graph .survol:focus-visible { stroke: var(--action-texte); stroke-width: 2; }
.infobulle { position: fixed; z-index: 70; pointer-events: none; background: var(--carte); color: var(--encre); border: 1px solid var(--filet); border-radius: 14px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(21, 22, 43, .16); font-size: 13px; min-width: 160px; max-width: min(290px, calc(100vw - 16px)); }
.ib-t { font-weight: 800; margin-bottom: 5px; color: var(--encre-2); font-size: 12.5px; }
.ib-r { display: grid; grid-template-columns: 14px auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 2px 0; }
.ib-cle { width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
.ib-cle.barre { width: 11px; height: 11px; border-radius: 3px; }
.ib-v { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ib-n { color: var(--encre-3); font-weight: 600; }

/* Feuilles (saisie, budget, catégorie) */
.feuille { position: fixed; inset: 0; z-index: 50; background: var(--fond); overflow-y: auto; overscroll-behavior: contain; animation: monter .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes monter { from { transform: translateY(28px); opacity: .3; } }
.feuille-cadre { min-height: 100%; display: flex; flex-direction: column; max-width: 580px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.feuille-tete { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; padding-block: 14px 6px; }
.feuille-tete h2 { text-align: center; font-family: var(--f-titre); font-weight: 800; font-size: 20px; }
.feuille-corps { display: grid; gap: 20px; padding-block: 6px 24px; flex: 1; align-content: start; }
.feuille-pied { position: sticky; bottom: 0; display: flex; gap: 10px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--fond) 78%, transparent); }
.feuille-pied .btn-principal { flex: 1; padding-block: 16px; font-size: 16.5px; }
.type-op { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type-op button { border: 0; border-radius: 16px; padding: 12px; font-weight: 800; font-size: 15px; cursor: pointer; background: var(--carte); color: var(--encre-2); box-shadow: var(--ombre); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.type-op button[data-type="depense"][aria-pressed="true"] { background: var(--serie-dep); color: #15162B; }
.type-op button[data-type="revenu"][aria-pressed="true"] { background: var(--serie-rev); color: #15162B; }
.champ-montant { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 18px 10px 14px; border-radius: 22px; background: var(--carte); box-shadow: var(--ombre); }
.champ-montant:focus-within { box-shadow: 0 0 0 3px var(--action); }
.champ-montant input { width: 4ch; max-width: 100%; min-width: 0; border: 0; background: none; color: var(--encre); text-align: right; font: 800 52px/1.05 var(--f-titre); padding: 0; }
.champ-montant input::placeholder { color: var(--filet-2); }
.champ-montant input:focus { outline: none; }
.euro { font-family: var(--f-titre); font-weight: 800; font-size: 34px; color: var(--encre-3); }
.bloc { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 10px; }
.bloc legend, .bloc h3 { padding: 0; margin-bottom: 2px; }
.bloc h3 { font-family: var(--f-titre); font-size: 18px; font-weight: 800; }
.raccourcis { display: flex; flex-wrap: wrap; gap: 8px; }
.raccourci { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 6px 12px 6px 6px; background: var(--carte); box-shadow: var(--ombre); font-weight: 700; font-size: 13.5px; cursor: pointer; max-width: 100%; text-align: left; }
.raccourci .ico-cat { width: 28px; height: 28px; border-radius: 50%; }
.raccourci .ico-cat .ico { width: 15px; height: 15px; }
.raccourci b { font-weight: 800; white-space: nowrap; }
.puces { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.puces.puces-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.puce { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 80px; padding: 10px 4px 8px; border-radius: 18px; border: 0; background: var(--carte); box-shadow: var(--ombre); color: var(--encre); font-size: 12.5px; font-weight: 750; line-height: 1.15; text-align: center; cursor: pointer; min-width: 0; }
.puce .ico-cat { width: 38px; height: 38px; border-radius: 13px; }
.puce[aria-pressed="true"] { background: color-mix(in srgb, var(--cc) var(--teinte), var(--carte)); box-shadow: 0 0 0 3px var(--cc); }
.dates { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.puce-date { padding: 10px 15px; border-radius: 999px; border: 0; background: var(--carte); box-shadow: var(--ombre); color: var(--encre); font-weight: 800; font-size: 14px; cursor: pointer; }
.puce-date[aria-pressed="true"] { background: var(--action); color: var(--sur-action); }
input[type="date"] { font-size: 16px; padding: 9px 11px; border: 0; border-radius: 12px; background: var(--carte); box-shadow: var(--ombre); color: var(--encre); min-width: 0; }
.champ { display: grid; gap: 8px; }
.champ input, .champ-euro input { width: 100%; font-size: 16px; padding: 13px 14px; border: 0; border-radius: 14px; background: var(--carte); box-shadow: var(--ombre); color: var(--encre); }
.champ-euro { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--encre-2); }
.champ-euro input { max-width: 160px; font-weight: 800; font-size: 18px; }
.facultatif { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--encre-3); }
.aide { font-size: 13.5px; color: var(--encre-3); font-weight: 500; }
.erreur { color: var(--mauvais); font-size: 13.5px; font-weight: 700; }
.erreur:empty { display: none; }
.env-champs { display: grid; gap: 8px; }
.env-champ { display: grid; grid-template-columns: 34px minmax(0, 1fr) 110px; align-items: center; gap: 10px; }
.env-champ .ico-cat { width: 34px; height: 34px; border-radius: 11px; }
.env-champ label { font-weight: 750; min-width: 0; }
.env-champ label small { display: block; font-weight: 600; color: var(--encre-3); font-size: 12px; }
.env-champ input { width: 100%; font-size: 16px; font-weight: 800; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--carte); box-shadow: var(--ombre); color: var(--encre); text-align: right; }
.resume-budget { padding: 14px 16px; border-radius: 18px; background: var(--lavande); font-weight: 600; }
.resume-budget strong { font-family: var(--f-titre); font-size: 20px; }
.fiche-tete { display: flex; align-items: center; gap: 14px; }
.fiche-tete .ico-cat { width: 56px; height: 56px; border-radius: 18px; }
.fiche-tete .ico-cat .ico { width: 28px; height: 28px; }
.fiche-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fiche-stat { background: var(--carte); border-radius: 16px; padding: 12px; box-shadow: var(--ombre); display: grid; gap: 2px; }
.fiche-stat strong { font-family: var(--f-titre); font-size: 20px; }
.fiche-stat span { font-size: 12.5px; font-weight: 700; color: var(--encre-3); }

/* Bandeau, notifications, états */
.bandeau { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: 18px; background: var(--ciel); color: var(--encre); font-size: 14px; font-weight: 600; margin-top: 10px; }
.bandeau > .ico { color: var(--action-texte); }
.bandeau p { flex: 1 1 220px; min-width: 0; }
.bandeau-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.accueil-vide { display: grid; gap: 12px; justify-items: start; padding: 24px 20px; background: var(--lavande); }
.accueil-vide h2 { font-size: 26px; }
.accueil-vide p { color: var(--encre-2); max-width: 46ch; }
.chargement { display: grid; place-items: center; gap: 16px; padding: 80px 16px; color: var(--encre-2); font-weight: 700; }
.chargement-pastilles { display: flex; gap: 8px; }
.chargement-pastilles i { width: 14px; height: 14px; border-radius: 50%; background: var(--serie-epa); animation: rebond 1s ease-in-out infinite; }
.chargement-pastilles i:nth-child(2) { background: var(--serie-dep); animation-delay: .15s; }
.chargement-pastilles i:nth-child(3) { background: var(--serie-rev); animation-delay: .3s; }
@keyframes rebond { 50% { transform: translateY(-8px); } }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(var(--h-onglets) + 92px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 16px; border-radius: 16px; background: var(--encre); color: var(--fond); box-shadow: 0 10px 30px rgba(21, 22, 43, .25); font-size: 14px; font-weight: 700; }
.toast button { border: 0; background: var(--action); color: var(--sur-action); font-weight: 800; border-radius: 10px; cursor: pointer; padding: 6px 10px; flex: none; }
.conseils { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.conseil { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 13px; border-radius: 18px; background: var(--carte-2); }
.conseil.alerte { background: var(--peche); }
.conseil.bravo { background: var(--menthe); }
.conseil.info { background: var(--ciel); }
.conseil.claude { background: var(--lavande); }
.conseil-ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--carte); }
.conseil.alerte .conseil-ico { color: var(--mauvais); }
.conseil.bravo .conseil-ico { color: var(--bon); }
.conseil.info .conseil-ico, .conseil.claude .conseil-ico { color: var(--action-texte); }
.conseil-ton { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--encre-2); }
.conseil-titre { font-weight: 800; margin-top: 1px; }

@keyframes tourne { to { transform: rotate(360deg); } }
.filtres { display: grid; gap: 10px; }
.filtre-ligne { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.dates-perso { display: flex; flex-wrap: wrap; gap: 8px 14px; }

.faits { display: grid; margin: 0; }
.fait { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--filet); }
.fait:last-child { border-bottom: 0; }

.fait dd { margin: 0; }
.fait-desc { color: var(--encre); font-size: 14.5px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Budget du mois ---------- */
function enveloppe(k) { const v = REG.enveloppes && REG.enveloppes[k]; return v > 0 ? Math.round(v * 100) : null; }

}

/* ---------- Analyse ---------- */
function ticksPeriode(per, N) {
  const out = [];
  if (per.type === 'semaine') { for (let i = 0; i < 7; i++) out.push({i: i, l: JOURS_I[ymd(per.debut + i).js]}); }
  else if (per.type === 'mois') { [1, 8, 15, 22, 29].forEach(d => { if (d - 1 < N) out.push({i: d - 1, l: String(d)}); }); }
  else if (per.type === 'trimestre' || per.type === 'annee') {
    for (let j = per.debut; j <= per.fin; j++) { const y = ymd(j); if (y.j === 1) out.push({i: j - per.debut, l: per.type === 'annee' ? MOIS_I[y.m - 1] : MOIS_C[y.m - 1]}); }
  } else { const k = Math.max(1, Math.round((N - 1) / 3)); for (let i = 0; i < N; i += k) out.push({i: i, l: dateCourte(per.debut + i, false)}); }
  return out;
}

    S.form.type = garde.type; majSaisie(); $('#f-date').value = garde.date; majDates();
    return;
  }
  fermerFeuille();
  enregistrer(tx, ancien);
}
function ouvrirBudget() {
  const I = infoMois(PA.a, PA.m), hab = (function () { const vals = prec3(I).map(Ii => agr(Ii.deb, Ii.fin).rev).filter(v => v > 0).sort((x, y) => x - y); return vals.length ? vals[Math.floor(vals.length / 2)] : null; })();
  const moyCat = {};
  const p3 = prec3(I);
  p3.forEach(Ii => { const c = agr(Ii.deb, Ii.fin).cat; for (const k in c) moyCat[k] = (moyCat[k] || 0) + c[k] / p3.length; });
  const base = REG.revenus ? REG.revenus * 100 : hab;
  const rapides = base ? [0.1, 0.2, 0.3].map(t => '<button type="button" class="puce-date" data-action="b-taux" data-v="' + Math.round(base * t / 1000) * 10 + '">' + pct(t) + ' · ' + eur0(Math.round(base * t / 1000) * 1000) + '</button>').join('') : '';
  ouvrirFeuilleCadre('<form class="feuille-cadre" id="b-form" novalidate role="dialog" aria-modal="true" aria-labelledby="f-titre">' + enteteFeuille('Mon budget') +
    '<div class="feuille-corps">' +
      '<section class="bloc"><h3>Objectif d’épargne</h3><p class="aide">Combien veux-tu mettre de côté chaque mois ?</p><div class="champ-euro"><label class="sr" for="b-objectif">Objectif mensuel en euros</label><input id="b-objectif" inputmode="decimal" placeholder="500" value="' + (REG.objectif || '') + '"> € par mois</div>' + (rapides ? '<div class="dates">' + rapides + '</div>' : '') + '</section>' +
      '<section class="bloc"><h3>Revenus du mois</h3><p class="aide">' + (hab ? 'Laisse vide pour utiliser tes revenus habituels (' + eur0(hab) + ' ces derniers mois).' : 'Indique ton salaire net mensuel habituel.') + '</p><div class="champ-euro"><label class="sr" for="b-revenus">Revenus mensuels en euros</label><input id="b-revenus" inputmode="decimal" placeholder="' + (hab ? Math.round(hab / 100) : '2500') + '" value="' + (REG.revenus || '') + '"> € par mois</div></section>' +
      '<div class="resume-budget" id="b-resume" aria-live="polite"></div>' +
      '<section class="bloc"><h3>Enveloppes par catégorie <span class="facultatif">(facultatif)</span></h3><p class="aide">Un plafond mensuel pour les catégories que tu veux surveiller. Laisse vide pour les autres.</p>' +
        '<div><button type="button" class="btn btn-doux btn-petit" data-action="b-moyennes">' + ico('etincelles') + 'Remplir avec mes moyennes</button></div><div class="env-champs">' +
        CATS.depense.map(c => '<div class="env-champ">' + icoCat(c) + '<label for="b-env-' + c.id + '">' + esc(c.nom) + (moyCat[c.id] ? '<small>moy. 3 mois : ' + eur0(moyCat[c.id]) + '</small>' : '') + '</label><input id="b-env-' + c.id + '" data-cat="' + c.id + '" data-moy="' + Math.round((moyCat[c.id] || 0) / 1000) * 10 + '" inputmode="decimal" placeholder="—" value="' + (REG.enveloppes[c.id] || '') + '"></div>').join('') + '</div></section>' +
      '<section class="bloc" id="b-donnees">' + htmlDonnees() + '</section>' +
    '</div><footer class="feuille-pied"><button type="submit" class="btn btn-principal">Enregistrer mon budget</button></footer></form>', 'budget');
  majResumeBudget();
}
function majResumeBudget() {
  const el = $('#b-resume');
  if (!el) return;
  const obj = lireMontant($('#b-objectif').value), rev = lireMontant($('#b-revenus').value);
  const I = infoMois(PA.a, PA.m), vals = prec3(I).map(Ii => agr(Ii.deb, Ii.fin).rev).filter(v => v > 0).sort((x, y) => x - y);
  const revenus = rev || (vals.length ? vals[Math.floor(vals.length / 2)] : 0);
  let env = 0;
  $$('#b-form .env-champ input').forEach(i => { env += lireMontant(i.value); });
  el.innerHTML = obj && revenus ? 'Budget de dépenses : ' + eur0(revenus) + ' − ' + eur0(obj) + ' = <strong>' + eur0(revenus - obj) + '</strong> par mois' + (env ? '<br><span class="aide">dont ' + eur0(env) + ' répartis en enveloppes</span>' : '')
    : 'Indique un objectif d’épargne pour obtenir ton budget de dépenses du mois.';
}
function soumettreBudget() {
  const obj = lireMontant($('#b-objectif').value), rev = lireMontant($('#b-revenus').value), env = {};
  $$('#b-form .env-champ input').forEach(i => { const v = lireMontant(i.value); if (v) env[i.dataset.cat] = v / 100; });
  fermerFeuille();
  sauverReglages({objectif: obj ? obj / 100 : null, revenus: rev ? rev / 100 : null, enveloppes: env});
}
function ouvrirFiche(k) {
  GRAPHS = GRAPHS.filter(g => g.id !== 'g-fiche');
  ouvrirFeuilleCadre('<div class="feuille-cadre" role="dialog" aria-modal="true" aria-labelledby="f-titre">' + enteteFeuille(esc(cat(k).nom)) + '<div class="feuille-corps" id="fiche-corps">' + htmlFicheCat(k) + '</div></div>', 'cat:' + k);
  monterGraphiques();
}
function majFiche() {
  if (!S.feuille || S.feuille.indexOf('cat:') !== 0) return;
  const corps = $('#fiche-corps');
  if (!corps) return;
  const k = S.feuille.slice(4), act = document.activeElement && document.activeElement.id === 'fc-env';
  if (act) return;
  GRAPHS = GRAPHS.filter(g => g.id !== 'g-fiche');
  corps.innerHTML = htmlFicheCat(k);
}

/* ---------- Notifications et bandeau ---------- */
let minuteurToast = null;
function toast(msg, action, duree) {
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button">' + esc(action.label) + '</button>' : '');
  el.hidden = false;
  if (action) el.querySelector('button').onclick = () => { el.hidden = true; action.fn(); };
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { el.hidden = true; }, duree || 5500);
}
function bandeau(icone, texte, actions) {
  return '<div class="bandeau">' + ico(icone) + '<p>' + texte + '</p>' + (actions ? '<div class="bandeau-actions">' + actions + '</div>' : '') + '</div>';
}
function renderBandeau() {
  const el = $('#bandeau'), meta = lireMeta(), parts = [], maintenant = Date.now();
  if (!autonome() && !(meta.installMasque > maintenant - 14 * JMS)) {
    if (invitInstall) parts.push(bandeau('telecharger', '<strong>Installe Carnet</strong> sur ton écran d’accueil pour l’ouvrir comme une appli, même hors connexion.',
      '<button type="button" class="btn btn-principal btn-petit" data-action="installer">Installer</button><button type="button" class="btn btn-doux btn-petit" data-action="masquer-install">Plus tard</button>'));
    else if (estIOS) parts.push(bandeau('partager', '<strong>Installe Carnet avant de commencer</strong> : touche ' + ico('partager', 'ico-inline') + ' Partager, puis « Sur l’écran d’accueil ». L’appli installée garde ses propres données, séparées de Safari.',
      '<button type="button" class="btn btn-doux btn-petit" data-action="masquer-install">OK</button>'));
  }
  const n = S.tx.filter(t => t.exemple).length, reels = S.tx.length - n;
  if (n) parts.push(S.confirmEffacer
    ? bandeau('poubelle', 'Effacer les ' + n + ' opérations d’exemple ? Tes propres saisies sont conservées.', '<button type="button" class="btn btn-danger btn-petit" data-action="confirmer-effacement">Effacer les exemples</button><button type="button" class="btn btn-doux btn-petit" data-action="annuler-effacement">Annuler</button>')
    : bandeau('info', '<strong>Données d’exemple.</strong> Elles te montrent l’appli en situation. Efface-les pour commencer avec tes propres opérations.', '<button type="button" class="btn btn-doux btn-petit" data-action="effacer-exemples">Effacer les exemples</button>'));
  else if (reels >= 15 && (!meta.sauvegarde || meta.sauvegarde < maintenant - 30 * JMS) && !(meta.rappelMasque > maintenant - 7 * JMS))
    parts.push(bandeau('info', 'Ton carnet n’existe que sur ce téléphone. <strong>Pense à le sauvegarder</strong> de temps en temps.',
      '<button type="button" class="btn btn-principal btn-petit" data-action="sauvegarder">Sauvegarder</button><button type="button" class="btn btn-doux btn-petit" data-action="masquer-rappel">Plus tard</button>'));
  el.innerHTML = parts.join('');
}
function majFab() { $('#fab').hidden = S.onglet !== 'vue360'; }

/* ---------- Rendu ---------- */
function cleFocus(el) {
  if (!el || el === document.body || (!$('#vue').contains(el) && !$('#bandeau').contains(el))) return null;
  if (el.id) return '#' + el.id;
  const d = el.dataset || {};
  if (!d.action) return null;
  let sel = '[data-action="' + d.action + '"]';
  ['type', 'cat', 'cmp', 'cible', 'cle', 'onglet', 'id', 'j'].forEach(k => { if (d[k] != null) sel += '[data-' + k + '="' + String(d[k]).replace(/"/g, '\\"') + '"]'; });
  return sel;
}
function render() {
  const act = document.activeElement, cle = cleFocus(act);
  const sel = act && act.id && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
  toutCacher();
  renderBandeau();
  $$('.onglet').forEach(b => { if (b.dataset.onglet === S.onglet) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  GRAPHS = [];
  let h;
  if (S.mode === 'chargement') h = '<section class="chargement" aria-live="polite"><div class="chargement-pastilles"><i></i><i></i><i></i></div><p>Ouverture de ton carnet…</p></section>';
  else if (S.onglet === 'analyse') h = vueAnalyse();
  else if (S.onglet === 'bilan') h = vueBilan();
  else h = vue360();
  $('#vue').innerHTML = h;
  majFiche();
  monterGraphiques();
  majFab();
  if (cle) {
    let el = null;
    try { el = document.querySelector(cle); } catch (e) { el = null; }
    if (el) { try { el.focus({preventScroll: true}); if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* rien */ } }
  }
}
function allerOnglet(o) {
  if (['vue360', 'analyse', 'bilan'].indexOf(o) < 0) o = 'vue360';
  if (S.onglet !== o) { S.onglet = o; render(); window.scrollTo(0, 0); }
  try { if (location.hash !== '#' + o) location.hash = o; } catch (e) { /* rien */ }
}
function ongletDuLien() { const h = (location.hash || '').replace('#', ''); return ['vue360', 'analyse', 'bilan'].indexOf(h) >= 0 ? h : 'vue360'; }
function decalerMois(cible, n) {
  const obj = cible === 'bilan' ? S.bilan : S.m360, r = ajMois(obj.a, obj.m, n);
  obj.a = r.a; obj.m = r.m;
  if (cible === 'm360') { S.filtreCat = null; S.toutesCats = false; }
  render();
}

/* ---------- Événements ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action, A = S.an;
  switch (a) {
    case 'onglet': allerOnglet(el.dataset.onglet); break;
    case 'ajouter': ouvrirSaisie(null); break;
    case 'editer': { const t = S.tx.find(x => x.id === el.dataset.id); if (t) ouvrirSaisie(t); break; }
    case 'ouvrir-budget': ouvrirBudget(); break;
    case 'fiche-cat': ouvrirFiche(el.dataset.cat); break;
    case 'toutes-cats': S.toutesCats = true; render(); break;
    case 'mois-prec': decalerMois(el.dataset.cible, -1); break;
    case 'mois-suiv': decalerMois(el.dataset.cible, 1); break;
    case 'retirer-filtre': S.filtreCat = null; render(); break;
    case 'filtre-type': S.filtreType = el.dataset.type; render(); break;
    case 'tableau': S.tableaux[el.dataset.cle] = !S.tableaux[el.dataset.cle]; render(); break;
    case 'cal-jour': S.calJour = +el.dataset.j; render(); break;
    case 'per-type': {
      const t = el.dataset.type;
      if (t === 'perso' && A.type !== 'perso') { const p = periodeAn(); A.du = p.debut; A.au = Math.min(p.fin, AUJ); }
      else if (t !== 'perso' && A.type === 'perso') A.ancre = Math.min(Math.max(A.du, A.au), AUJ);
      A.type = t; A.toutes = false; S.calJour = null; render(); break;
    }
    case 'per-prec': case 'per-suiv': { const p = decaler(periodeAn(), a === 'per-prec' ? -1 : 1); A.ancre = p.debut; A.toutes = false; S.calJour = null; render(); break; }
    case 'per-auj': A.ancre = AUJ; A.toutes = false; S.calJour = null; render(); break;
    case 'cmp': A.cmp = el.dataset.cmp; render(); break;
    case 'toutes-ops': A.toutes = true; render(); break;
    case 'effacer-exemples': if (S.feuille) fermerFeuille(); S.confirmEffacer = true; render(); window.scrollTo(0, 0); break;
    case 'annuler-effacement': S.confirmEffacer = false; render(); break;
    case 'confirmer-effacement': effacerExemples(); break;
    case 'export-csv': exporterCSV(); break;
    case 'charger-exemples': chargerExemples(); break;
    case 'importer': { const inp = $('#import-fichier'); if (inp) inp.click(); break; }
    case 'sauvegarder': sauvegarder(); break;
    case 'import-ajouter': appliquerImport('ajouter'); break;
    case 'import-remplacer': {
      const imp = S.importEnAttente;
      if (!imp || !imp.ops) break;
      if (S.tx.some(t => !t.exemple) && !imp.confirmer) { imp.confirmer = true; majDonnees(); break; }
      appliquerImport('remplacer');
      break;
    }
    case 'import-annuler': S.importEnAttente = null; majDonnees(); break;
    case 'tout-effacer': S.confirmTout = true; majDonnees(); break;
    case 'tout-effacer-non': S.confirmTout = false; majDonnees(); break;
    case 'tout-effacer-ok': S.confirmTout = false; fermerFeuille(); toutEffacer(); break;
    case 'installer': if (invitInstall) { const p = invitInstall; invitInstall = null; p.prompt(); Promise.resolve(p.userChoice).catch(() => {}).then(() => renderBandeau()); } break;
    case 'masquer-install': ecrireMeta({installMasque: Date.now()}); renderBandeau(); break;
    case 'masquer-rappel': ecrireMeta({rappelMasque: Date.now()}); renderBandeau(); break;
    case 'fermer': S.importEnAttente = null; S.confirmTout = false; fermerFeuille(); break;
    case 'f-type': if (S.form) { S.form.type = el.dataset.type; if (!CAT[S.form.categorie] || CAT[S.form.categorie].type !== S.form.type) S.form.categorie = null; majSaisie(); } break;
    case 'f-cat': if (S.form) { S.form.categorie = el.dataset.cat; $$('#f-cats .puce').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === S.form.categorie))); $('#f-err-cat').textContent = ''; } break;
    case 'f-date': { const d = $('#f-date'); if (d) { d.value = el.dataset.date; majDates(); } break; }
    case 'f-raccourci': {
      const f = S.form && S.form.freq && S.form.freq[+el.dataset.i];
      if (!f) break;
      S.form.type = f.type; S.form.categorie = f.categorie; majSaisie();
      $('#f-note').value = f.note;
      if (f.montant) { $('#f-montant').value = (f.montant / 100).toFixed(2).replace('.', ','); tailleMontant(); $('#f-valider').focus(); }
      else $('#f-montant').focus();
      $('#f-err-montant').textContent = ''; $('#f-err-cat').textContent = '';
      break;
    }
    case 'f-encore': soumettre(true); break;
    case 'f-supprimer': {
      const f = S.form;
      if (!f || !f.origine) break;
      if (!f.confirmer) { f.confirmer = true; el.querySelector('span').textContent = 'Confirmer'; break; }
      const t = f.origine;
      fermerFeuille();
      supprimer(t, false);
      break;
    }
    case 'b-taux': { const i = $('#b-objectif'); if (i) { i.value = el.dataset.v; majResumeBudget(); } break; }
    case 'b-moyennes': $$('#b-form .env-champ input').forEach(i => { if (!i.value && +i.dataset.moy > 0) i.value = i.dataset.moy; }); majResumeBudget(); break;
    case 'fc-env': {
      const k = el.dataset.cat, v = lireMontant($('#fc-env').value), env = Object.assign({}, REG.enveloppes);
      if (v) env[k] = v / 100; else delete env[k];
      sauverReglages({objectif: REG.objectif, revenus: REG.revenus, enveloppes: env});
      break;
    }
  }
});
document.addEventListener('submit', e => {
  if (!e.target) return;
  if (e.target.id === 'f-form') { e.preventDefault(); soumettre(false); }
  else if (e.target.id === 'b-form') { e.preventDefault(); soumettreBudget(); }
});
document.addEventListener('input', e => {
  const id = e.target && e.target.id;
  if (id === 'recherche-360') { S.recherche = e.target.value; render(); }
  else if (id === 'f-montant') { tailleMontant(); $('#f-err-montant').textContent = ''; }
  else if (id === 'f-date') majDates();
  else if (id && id.indexOf('b-') === 0) majResumeBudget();
});
document.addEventListener('change', e => {
  const id = e.target && e.target.id;
  if (id === 'a-du' || id === 'a-au') {
    const v = e.target.value;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { S.an[id === 'a-du' ? 'du' : 'au'] = jourDe(v); S.an.toutes = false; render(); }
  } else if (id === 'f-date') majDates();
  else if (id === 'import-fichier') { const f = e.target.files && e.target.files[0]; if (f) importerFichier(f); e.target.value = ''; }
});
document.addEventListener('keydown', e => {
  if (!S.feuille) return;
  if (e.key === 'Escape') { e.preventDefault(); fermerFeuille(); return; }
  if (e.key === 'Tab') {
    const f = $$('#feuille button:not([disabled]), #feuille input, #feuille summary');
    if (!f.length) return;
    const premier = f[0], dernier = f[f.length - 1];
    if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
    else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
  }
});
document.addEventListener('pointerdown', e => { if (!e.target.closest || !e.target.closest('.graph')) toutCacher(); }, true);
window.addEventListener('scroll', () => { const el = $('#infobulle'); if (el && !el.hidden) toutCacher(); }, {passive: true});
$('#feuille').addEventListener('scroll', () => { const el = $('#infobulle'); if (el && !el.hidden) toutCacher(); }, {passive: true});
window.addEventListener('hashchange', () => { const o = ongletDuLien(); if (o !== S.onglet) { S.onglet = o; render(); window.scrollTo(0, 0); } });
let minuteurTaille = null;
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    clearTimeout(minuteurTaille);
    minuteurTaille = setTimeout(() => {
      const change = GRAPHS.some(g => { const el = document.getElementById(g.id); return el && Math.abs(el.clientWidth - (g.w || 0)) > 2; });
      if (change) { toutCacher(); monterGraphiques(); }
    }, 120);
  }).observe(document.body);
}

/* ---------- Démarrage ---------- */
function autonome() {
  try { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; } catch (e) { return false; }
}
const estIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); invitInstall = e; renderBandeau(); });
window.addEventListener('appinstalled', () => { invitInstall = null; renderBandeau(); });
window.addEventListener('storage', e => { if (e.key === CLE) { charger(); render(); } });
function demarrer() {
  try { document.documentElement.lang = 'fr'; } catch (e) { /* rien */ }
  $$('[data-ico]').forEach(el => { el.innerHTML = ico(el.dataset.ico); });
  S.onglet = ongletDuLien();
  charger();
  S.mode = 'pret';
  render();
  let ajout = false;
  try {
    const u = new URL(location.href);
    ajout = u.searchParams.get('ajout') === '1';
    if (ajout) history.replaceState(null, '', u.pathname + u.hash);
  } catch (e) { /* rien */ }
  if (ajout) ouvrirSaisie(null);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
demarrer();
})();
